name: Twelve Data Telegram Bot 24/7

on:
  schedule:
    - cron: '*/15 * * * *'  # 15 நிமிடங்களுக்கு ஒருமுறை தானாக இயங்கும்
  workflow_dispatch:        # கையால் இயக்கவும் உதவும்

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python twelve_data_bot.py
